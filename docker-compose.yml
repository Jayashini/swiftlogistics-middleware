services:

  postgres:

    image: postgres:15-alpine

    environment:

      POSTGRES_DB: swiftlogistics

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swiftlogistics"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:

    image: rabbitmq:3-management

    ports:

      - "5672:5672"

      - "15672:15672"

    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator:

    build:

      context: ./orchestrator

    ports:

      - "8000:8000"

    environment:

      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/swiftlogistics

      RABBITMQ_HOST: rabbitmq

    depends_on:

      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

  consumer:

    build:

      context: ./consumers

    environment:

      RABBITMQ_HOST: rabbitmq

    depends_on:

      - rabbitmq

      - mock-cms

      - mock-ros

      - mock-wms

  mock-cms:

    build:

      context: ./mock-cms

    ports:

      - "8001:8001"

  mock-ros:

    build:

      context: ./mock-ros

    ports:

      - "8002:8002"

  mock-wms:

    build:

      context: ./mock-wms

    ports:

      - "9000:9000"

  frontend:

    build:

      context: ./frontend

    ports:

      - "5173:5173"

    depends_on:

      - orchestrator

volumes:

  postgres_data:
